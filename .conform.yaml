policies:
  - type: commit
    spec:
      header:
        length: 90
        imperative: true
        case: lower
        invalidLastCharacters: .
      body:
        required: false
      dco: true
      spellcheck:
        locale: US
        ignore-rules:
          - internetbs
      maximumOfOneCommit: true
      conventional:
        types:
          - feat
          - chore
          - docs
          - refactor
          - revert
          - style
          - test
        scopes:
          - cloudflare
          - cloudns
          - digitalocean
          - dnsimple
          - gandi
          - godaddy
          - hetzner
          - infomaniak
          - internetbs
          - inwx
          - namecheap
          - netim
          - ovhcloud
          - porkbun
          - scaleway
          - vultr
        descriptionLength: 80
